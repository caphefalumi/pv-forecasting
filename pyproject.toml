[project]
name = "pv-forecasting"
version = "0.1.0"
description = "Day-ahead photovoltaic (PV) solar energy forecasting platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dvc[s3]>=3.59.0",
    "mlflow>=2.10.0",
    "numpy>=1.26.4",
    "openpyxl>=3.1.0",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "pandas>=2.1.0",
    "psycopg[binary]>=3.2.0",
    "psycopg2-binary>=2.9.10",
    "pvlib>=0.10.0",
    "pyarrow>=14.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "requests>=2.31.0",
    "scikit-learn>=1.3.0",
    "supabase>=2.0.0",
    "torch>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
]

[tool.uv]
package = false
