<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PV Solar Forecast (D+1) — COS40007 MLOps Platform</title>
    <meta
      name="description"
      content="Day-ahead 24-hour photovoltaic solar energy forecasting powered by PyTorch LSTM, Open-Meteo NWP, and MLflow Model Registry."
    />
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('theme')
          var mode =
            stored === 'light' || stored === 'dark' || stored === 'auto'
              ? stored
              : 'auto'
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var resolved = mode === 'auto' ? (prefersDark ? 'dark' : 'light') : mode
          var root = document.documentElement
          root.classList.remove('light', 'dark')
          root.classList.add(resolved)
          if (mode === 'auto') {
            root.removeAttribute('data-theme')
          } else {
            root.setAttribute('data-theme', mode)
          }
          root.style.colorScheme = resolved
        } catch (e) {}
      })()
    </script>
  </head>
  <body
    class="font-sans antialiased [overflow-wrap:anywhere] selection:bg-[rgba(79,184,178,0.24)]"
  >
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
