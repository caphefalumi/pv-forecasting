[project]
name = "backend"
version = "1.0.0"
description = "FastAPI Day-Ahead Solar PV Energy Forecasting Service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "mlflow-skinny>=3.17.0",
    "numpy>=2.5.4",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-instrumentation-fastapi==0.66b1",
    "opentelemetry-instrumentation-httpx==0.66b1",
    "opentelemetry-instrumentation-logging==0.66b1",
    "opentelemetry-sdk==1.45.1",
    "pandas>=3.0.6",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.1.4",
    "sqlparse>=0.6.0",
    "supabase>=2.32.0",
    "torch>=2.14.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/unit", "tests/integration"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests (fast, in-memory)",
    "integration: Integration tests (routes, external APIs, db)",
]

