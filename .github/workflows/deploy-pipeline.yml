name: Deploy Pipeline Image

# Builds the repo-root image that runs:
#   python ingest.py | evaluate.py | drift.py | retrain.py

on:
  push:
    branches:
      - master
      - main
    paths:
      - "ingest.py"
      - "evaluate.py"
      - "drift.py"
      - "retrain.py"
      - "jobs/**"
      - "pvdata/**"
      - "config/**"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/deploy-pipeline.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: pv-forecasting-pipeline

jobs:
  build-and-push:
    name: Build & push pipeline image to ECR
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-DeployPipeline
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Pipeline Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
