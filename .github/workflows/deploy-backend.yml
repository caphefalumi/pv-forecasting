name: Deploy Backend

on:
  push:
    branches: [master]
    paths:
      - "apps/backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend-prod
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: pv-forecasting-backend
  ECS_CLUSTER: pv-forecasting-cluster
  ECS_SERVICE: pv-forecasting-fastapi-service
  ALB_NAME: pv-forecasting-alb

jobs:
  build-and-deploy:
    name: build-and-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: prod
    permissions:
      contents: read
      id-token: write # AWS OIDC

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-DeployBackend
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Rolling deploy to ECS Fargate
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment \
            --region "$AWS_REGION" \
            --query "service.deployments[0].id" --output text

      - name: Wait for ECS service to be stable
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION"

      - name: Post-deploy /health check
        env:
          API_URL: ${{ vars.VITE_BACKEND_API_URL }}
        run: |
          BASE_URL="${API_URL%/}"
          if [ -z "$BASE_URL" ]; then
            ALB_DNS=$(aws elbv2 describe-load-balancers \
              --names "$ALB_NAME" \
              --query "LoadBalancers[0].DNSName" \
              --output text \
              --region "$AWS_REGION")
            BASE_URL="http://${ALB_DNS}"
          fi
          echo "Checking ${BASE_URL}/health"
          for _ in $(seq 1 12); do
            if curl -fsSL --max-time 10 "${BASE_URL}/health"; then
              echo
              echo "Health check OK"
              exit 0
            fi
            sleep 10
          done
          echo "::error::${BASE_URL}/health did not become healthy after deploy"
          exit 1
