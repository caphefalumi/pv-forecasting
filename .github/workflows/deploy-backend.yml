name: Deploy Backend

# Chain: build-and-push-image -> deploy-ecs (prod) -> health-check

on:
  push:
    branches: [master]
    paths:
      - "apps/backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend-prod
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: pv-forecasting-backend
  ECS_CLUSTER: pv-forecasting-cluster
  ECS_SERVICE: pv-forecasting-fastapi-service
  ALB_NAME: pv-forecasting-alb

jobs:
  build-and-push-image:
    name: build-and-push-image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # AWS OIDC (ECR push)
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-BackendImage
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Image name
        id: meta
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: echo "image=${REGISTRY}/${ECR_REPOSITORY}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "Pushed ${IMAGE}:${GITHUB_SHA} (${DIGEST})" >> "$GITHUB_STEP_SUMMARY"

  deploy-ecs:
    name: deploy-ecs
    needs: build-and-push-image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: prod
    permissions:
      contents: read
      id-token: write # AWS OIDC
    outputs:
      health_url: ${{ steps.url.outputs.health_url }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-DeployECS
          aws-region: ${{ env.AWS_REGION }}

      - name: Rolling deploy to ECS Fargate
        env:
          IMAGE: ${{ needs.build-and-push-image.outputs.image }}
          DIGEST: ${{ needs.build-and-push-image.outputs.digest }}
        run: |
          echo "Rolling ${ECS_SERVICE} onto ${IMAGE}:latest (${DIGEST})"
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment \
            --region "$AWS_REGION" \
            --query "service.deployments[0].id" --output text

      - name: Wait for ECS service to be stable
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION"

      - name: Resolve health URL
        id: url
        env:
          API_URL: ${{ vars.VITE_BACKEND_API_URL }}
        run: |
          BASE_URL="${API_URL%/}"
          if [ -z "$BASE_URL" ]; then
            ALB_DNS=$(aws elbv2 describe-load-balancers \
              --names "$ALB_NAME" \
              --query "LoadBalancers[0].DNSName" \
              --output text \
              --region "$AWS_REGION")
            BASE_URL="http://${ALB_DNS}"
          fi
          echo "health_url=${BASE_URL}/health" >> "$GITHUB_OUTPUT"

  health-check:
    name: health-check
    needs: deploy-ecs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: GET /health
        env:
          HEALTH_URL: ${{ needs.deploy-ecs.outputs.health_url }}
        run: |
          echo "Checking ${HEALTH_URL}"
          for _ in $(seq 1 12); do
            if curl -fsSL --max-time 10 "$HEALTH_URL"; then
              echo
              echo "Health check OK"
              exit 0
            fi
            sleep 10
          done
          echo "::error::${HEALTH_URL} did not become healthy after deploy"
          exit 1
