name: Deploy Backend

# Chain: build-and-push-image -> deploy-ecs (prod) -> health-check

on:
  push:
    branches: [master]
    paths:
      - "apps/backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend-prod
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: pv-forecasting-backend
  ECS_CLUSTER: pv-forecasting-cluster
  ECS_SERVICE: pv-forecasting-fastapi-service

jobs:
  build-and-push-image:
    name: build-and-push-image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # AWS OIDC (ECR push)
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The backend image pulls large torch/CUDA wheels; the hosted runner runs out of disk without this.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-BackendImage
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Image name
        id: meta
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: echo "image=${REGISTRY}/${ECR_REPOSITORY}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "Pushed ${IMAGE}:${GITHUB_SHA} (${DIGEST})" >> "$GITHUB_STEP_SUMMARY"

  deploy-ecs:
    name: deploy-ecs
    needs: build-and-push-image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: prod
    permissions:
      contents: read
      id-token: write # AWS OIDC
    outputs:
      health_url: ${{ steps.url.outputs.health_url }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-DeployECS
          aws-region: ${{ env.AWS_REGION }}

      - name: Rolling deploy to ECS Fargate
        env:
          IMAGE: ${{ needs.build-and-push-image.outputs.image }}
          DIGEST: ${{ needs.build-and-push-image.outputs.digest }}
        run: |
          echo "Rolling ${ECS_SERVICE} onto ${IMAGE}:latest (${DIGEST})"
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment \
            --region "$AWS_REGION" \
            --query "service.deployments[0].id" --output text

      # The service idles at desiredCount 0 (Terraform ignores desired_count), so a deploy
      # would leave nothing to health-check. Make sure at least one task is requested.
      - name: Ensure at least one API task
        run: |
          DESIRED=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --query "services[0].desiredCount" --output text)
          echo "Current desiredCount: ${DESIRED}"
          if [ "$DESIRED" = "0" ]; then
            aws ecs update-service \
              --cluster "$ECS_CLUSTER" \
              --service "$ECS_SERVICE" \
              --desired-count 1 \
              --region "$AWS_REGION" \
              --query "service.desiredCount" --output text
          fi

      - name: Wait for ECS service to be stable
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION"

      - name: Resolve health URL
        id: url
        env:
          API_URL: ${{ vars.VITE_BACKEND_API_URL }}
        run: |
          BASE_URL="${API_URL%/}"
          # The ALB only accepts Cloudflare's IP ranges, so the runner cannot reach its
          # hostname directly; the public API domain is the only valid health target.
          if [ -z "$BASE_URL" ]; then
            echo "::error::VITE_BACKEND_API_URL is empty on environment prod; set it to the public API URL (https://api-pv.tm-project.id.vn)"
            exit 1
          fi
          echo "health_url=${BASE_URL}/health" >> "$GITHUB_OUTPUT"

  health-check:
    name: health-check
    needs: deploy-ecs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: GET /health
        env:
          HEALTH_URL: ${{ needs.deploy-ecs.outputs.health_url }}
        run: |
          echo "Checking ${HEALTH_URL}"
          for _ in $(seq 1 12); do
            if curl -fsSL --connect-timeout 5 --max-time 10 "$HEALTH_URL"; then
              echo
              echo "Health check OK"
              exit 0
            fi
            sleep 10
          done
          echo "::error::${HEALTH_URL} did not become healthy after deploy"
          exit 1
