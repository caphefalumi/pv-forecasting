name: CI Pipeline (Integration & Build Checks)

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  backend-test:
    name: Backend API Unit & Integration Tests (FastAPI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Backend Dependencies
        run: |
          cd apps/backend
          uv sync --dev

      - name: Run Backend Unit Tests (pytest)
        run: |
          cd apps/backend
          uv run pytest tests/unit -v

      - name: Run Backend Integration Tests (pytest)
        run: |
          cd apps/backend
          uv run pytest tests/integration -v

  frontend-test-and-build:
    name: Frontend Tests & Production Build (bun:test & Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Frontend Dependencies
        run: |
          cd apps/frontend
          bun install --frozen-lockfile

      - name: Run Frontend Unit Tests (bun:test)
        run: |
          cd apps/frontend
          bun run test:unit

      - name: Run Frontend Integration Tests (bun:test)
        run: |
          cd apps/frontend
          bun run test:integration

      - name: Typecheck Frontend
        run: |
          cd apps/frontend
          bun x tsc --noEmit

      - name: Build Frontend Application
        run: |
          cd apps/frontend
          bun run build

  infra-and-ansible-checks:
    name: Infrastructure Linting & Ansible Architecture Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python for Ansible
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible Core
        run: |
          pip install --no-cache-dir ansible-core

      - name: Run Ansible Architecture Verification Playbook
        run: |
          ansible-playbook -i infra/ansible/inventory.ini infra/ansible/playbook.yml

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Validate Terraform Modular Stacks
        run: |
          cd infra/terraform
          terraform fmt -check
          terraform init -backend=false
          terraform validate
