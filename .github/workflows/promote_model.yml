name: Promote Model to Champion

on:
  workflow_dispatch:
    inputs:
      model_version:
        description: "Model version to promote (e.g. 1, 2). Leave blank to auto-detect candidate."
        required: false
        default: ""
      approver:
        description: "Admin username/tag approving this promotion"
        required: false
        default: ""

jobs:
  promote:
    name: Promote to Champion
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow requests python-dotenv psycopg2-binary "psycopg[binary]"

      - name: Run Promote Script
        env:
          SQL_ALCHEMY_DATABASE_URL: ${{ secrets.SQL_ALCHEMY_DATABASE_URL }}
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI || secrets.SQL_ALCHEMY_DATABASE_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}


        run: |
          APPROVER="${{ inputs.approver }}"
          if [ -z "$APPROVER" ]; then
            APPROVER="${{ github.actor }}"
          fi

          VERSION_ARG=""
          if [ -n "${{ inputs.model_version }}" ]; then
            VERSION_ARG="--version ${{ inputs.model_version }}"
          fi

          python promote.py $VERSION_ARG --approver "$APPROVER" -v
