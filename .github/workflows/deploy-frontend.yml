name: Deploy Frontend

on:
  push:
    branches: [master]
    paths:
      - "apps/frontend/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend-prod
  cancel-in-progress: false

env:
  BUN_VERSION: "1.3.12"
  VERCEL_CLI_VERSION: "64.5.0"

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: prod
    defaults:
      run:
        working-directory: apps/frontend
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve VITE_BACKEND_API_URL
        id: backend
        env:
          BACKEND_URL: ${{ vars.VITE_BACKEND_API_URL }}
          API_DOMAIN: ${{ vars.API_DOMAIN }}
        run: |
          URL="$BACKEND_URL"
          if [ -z "$URL" ] && [ -n "$API_DOMAIN" ]; then
            case "$API_DOMAIN" in
              https://*) URL="$API_DOMAIN" ;;
              *) URL="https://${API_DOMAIN}" ;;
            esac
          fi
          if [ -z "$URL" ]; then
            echo "::error::Set the VITE_BACKEND_API_URL (or API_DOMAIN) variable on the prod environment"
            exit 1
          fi
          echo "url=${URL%/}" >> "$GITHUB_OUTPUT"
          echo "VITE_BACKEND_API_URL=${URL%/}"

      - name: Pull Vercel project settings
        run: npx --yes "vercel@${VERCEL_CLI_VERSION}" pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build (prebuilt, bakes in VITE_BACKEND_API_URL)
        env:
          VITE_BACKEND_API_URL: ${{ steps.backend.outputs.url }}
          VITE_FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
        run: npx --yes "vercel@${VERCEL_CLI_VERSION}" build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt output to Vercel (prod)
        run: npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"
