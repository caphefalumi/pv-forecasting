name: Deploy Frontend to Vercel

on:
  push:
    branches:
      - master
      - main
    paths:
      - "apps/frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ALB_NAME: pv-forecasting-alb

jobs:
  deploy:
    name: Deploy frontend (prod)
    runs-on: ubuntu-latest
    environment: prod
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        continue-on-error: true
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-DeployFrontend
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve VITE_BACKEND_API_URL (ALB or env var)
        id: backend
        working-directory: .
        run: |
          URL="${{ vars.VITE_BACKEND_API_URL }}"
          if [ -z "$URL" ]; then
            ALB_DNS=$(aws elbv2 describe-load-balancers \
              --names "${{ env.ALB_NAME }}" \
              --query "LoadBalancers[0].DNSName" \
              --output text \
              --region "${{ env.AWS_REGION }}" 2>/dev/null || echo "")
            if [ -n "$ALB_DNS" ] && [ "$ALB_DNS" != "None" ]; then
              URL="http://${ALB_DNS}"
            fi
          fi
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "Resolved VITE_BACKEND_API_URL=${URL:-<empty>}"

      - name: Deploy to Vercel (prod)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_BACKEND_API_URL: ${{ steps.backend.outputs.url }}
          VITE_FRONTEND_ORIGIN: https://pv-forecasting.vercel.app
        run: |
          bun x vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          bun x vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"
