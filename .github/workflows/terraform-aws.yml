name: Terraform AWS Infrastructure

on:
  push:
    branches:
      - main
      - master
    paths:
      - "infra/terraform/**"
      - "!infra/terraform/supabase/**"
      - ".github/workflows/terraform-aws.yml"
  pull_request:
    paths:
      - "infra/terraform/**"
      - "!infra/terraform/supabase/**"
      - ".github/workflows/terraform-aws.yml"
  workflow_dispatch:

permissions:
  id-token: write   # Required for AWS OIDC authentication
  contents: read

env:
  AWS_REGION: ap-south-1

jobs:
  terraform-aws:
    name: Plan & Apply AWS Modular Infrastructure
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-TerraformAWS
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.3"

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init (S3 Remote State in Supabase Storage)
        run: |
          terraform init \
            -backend-config="access_key=${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}" \
            -backend-config="secret_key=${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="supabase_url=${{ secrets.SUPABASE_URL }}" \
            -var="supabase_service_role_key=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -var="mlflow_tracking_uri=${{ secrets.MLFLOW_TRACKING_URI }}" \
            -no-color

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          terraform apply -auto-approve \
            -var="supabase_url=${{ secrets.SUPABASE_URL }}" \
            -var="supabase_service_role_key=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -var="mlflow_tracking_uri=${{ secrets.MLFLOW_TRACKING_URI }}" \
            -no-color
