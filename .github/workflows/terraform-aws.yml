name: Terraform AWS

# Remote state: Supabase Storage S3-compatible backend (bucket terraform-state / aws/terraform.tfstate)
# Working directory: infra/terraform  (do NOT run terraform from repo root)

on:
  push:
    branches: [main, master]
    paths:
      - "infra/terraform/**"
      - "!infra/terraform/supabase/**"
      - ".github/workflows/terraform-aws.yml"
  pull_request:
    paths:
      - "infra/terraform/**"
      - "!infra/terraform/supabase/**"
      - ".github/workflows/terraform-aws.yml"
  workflow_dispatch:
    inputs:
      apply:
        description: "Run terraform apply after plan"
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read
  actions: write

env:
  AWS_REGION: ap-south-1
  TF_IN_AUTOMATION: "true"

jobs:
  terraform:
    name: fmt → init → validate → plan → apply
    runs-on: ubuntu-latest
    environment: prod
    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-TerraformAWS
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.3"
          terraform_wrapper: false

      - name: Terraform fmt -check
        run: terraform fmt -check -recursive

      - name: Terraform init (Supabase S3 backend)
        run: |
          terraform init -input=false \
            -backend-config="access_key=${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}" \
            -backend-config="secret_key=${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        run: |
          terraform plan -input=false -no-color -out=tfplan \
            -var="supabase_url=${{ secrets.SUPABASE_URL }}" \
            -var="supabase_service_role_key=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -var="mlflow_tracking_uri=${{ secrets.MLFLOW_TRACKING_URI }}" \
            -var="supabase_s3_access_key=${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}" \
            -var="supabase_s3_secret_key=${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}" \
            -var="otel_exporter_otlp_protocol=${{ vars.OTEL_EXPORTER_OTLP_PROTOCOL }}" \
            -var="otel_exporter_otlp_endpoint=${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}" \
            -var="otel_exporter_otlp_headers=${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}" \
            -var="grafana_otlp_instance_id=${{ vars.GRAFANA_OTLP_INSTANCE_ID }}" \
            -var="grafana_cloud_api_token=${{ secrets.GRAFANA_CLOUD_API_TOKEN }}"

      - name: Terraform apply
        if: >-
          github.event_name == 'workflow_dispatch' && inputs.apply ||
          (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
        run: terraform apply -input=false -auto-approve -no-color tfplan

      - name: Publish ALB URL + frontend origin to GitHub env vars
        if: >-
          github.event_name == 'workflow_dispatch' && inputs.apply ||
          (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ALB_URL=$(terraform output -raw alb_dns_name)
          gh variable set VITE_BACKEND_API_URL --env prod --body "$ALB_URL" --repo "$GITHUB_REPOSITORY"
          gh variable set FRONTEND_ORIGIN --env prod --body "https://pv-forecasting.vercel.app" --repo "$GITHUB_REPOSITORY"
          echo "Set VITE_BACKEND_API_URL=$ALB_URL"
          echo "Set FRONTEND_ORIGIN=https://pv-forecasting.vercel.app"
