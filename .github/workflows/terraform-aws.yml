name: Terraform AWS

# Remote state: Supabase Storage S3-compatible backend (bucket terraform-state / aws/terraform.tfstate)
# Working directory: infra/terraform (do NOT run terraform from repo root)
# Chain: fmt -> validate -> plan (uploads tfplan) -> apply (master only, prod env, applies that exact plan)
# Manual destroy: workflow_dispatch with action=destroy and confirm_destroy=destroy-pv-forecasting
# (master only, prod env). plan/apply jobs are skipped. It tears down only what costs money: ALB
# (+ listeners, target group, and the Cloudflare api record that points at it), ECS cluster/services/
# task definitions, Step Functions, EventBridge schedules and CloudWatch log groups. Every resource in
# state is targeted by full address except the kept ones, and a guard fails the run if the plan would
# delete a kept resource (-target also destroys dependents).
# Kept on purpose: all aws_iam_* (incl. the GitHub OIDC provider and CI role), ECR (module.ecr, images
# survive), security groups, VPC networking, ACM cert + Cloudflare acm_validation records, SSM
# parameters, the Cloudflare zone setting, and the SQS DLQ (an IAM policy references its ARN).
# A later apply recreates the destroyed parts and re-adopts the kept ones (they stay in state).
# If nothing billable is left, the run ends green without planning. The Supabase state bucket
# from backend.tf is never destroyed.

on:
  push:
    branches: [master]
    paths:
      - "infra/terraform/**"
      - "!infra/terraform/supabase/**"
      - ".github/workflows/terraform-aws.yml"
  pull_request:
    paths:
      - "infra/terraform/**"
      - "!infra/terraform/supabase/**"
      - ".github/workflows/terraform-aws.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "plan = plan only; apply = plan + apply (master only); destroy = plan -destroy + apply (master only)"
        type: choice
        options:
          - plan
          - apply
          - destroy
        default: plan
      confirm_destroy:
        description: "Required for action=destroy: type destroy-pv-forecasting"
        type: string
        required: false
        default: ""

permissions:
  contents: read

# One run at a time against the shared state; never cancel a running apply.
concurrency:
  group: terraform-aws
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  TF_VERSION: "1.14.3"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

defaults:
  run:
    working-directory: infra/terraform

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt -check
        run: terraform fmt -check -recursive -diff

  validate:
    name: validate
    needs: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init (no backend)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

  plan:
    name: plan
    needs: validate
    # Dependabot runs get no secrets, so skip the secret-backed jobs for them.
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'workflow_dispatch' || inputs.action != 'destroy')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # prod holds the env-scoped secrets/vars the plan needs (no protection rules today).
    environment: prod
    permissions:
      contents: read
      id-token: write # AWS OIDC
    env:
      TF_BACKEND_ACCESS_KEY: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
      TF_BACKEND_SECRET_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_grafana_cloud_api_token: ${{ secrets.GRAFANA_CLOUD_API_TOKEN }}
      TF_VAR_otel_exporter_otlp_headers: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
      TF_VAR_supabase_service_role_key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TF_VAR_mlflow_tracking_uri: ${{ secrets.MLFLOW_TRACKING_URI }}
      TF_VAR_supabase_s3_access_key: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
      TF_VAR_supabase_s3_secret_key: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
      TF_VAR_supabase_url: ${{ secrets.SUPABASE_URL }}
      TF_VAR_otel_exporter_otlp_protocol: ${{ vars.OTEL_EXPORTER_OTLP_PROTOCOL }}
      TF_VAR_otel_exporter_otlp_endpoint: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
      TF_VAR_grafana_otlp_instance_id: ${{ vars.GRAFANA_OTLP_INSTANCE_ID }}
      TF_VAR_api_domain: ${{ vars.API_DOMAIN }}
      TF_VAR_cloudflare_zone_name: ${{ vars.CLOUDFLARE_ZONE_NAME }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Cloudflare API token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is empty on environment prod"
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-TerraformAWS-Plan
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init (Supabase S3 backend)
        run: |
          terraform init \
            -backend-config="access_key=${TF_BACKEND_ACCESS_KEY}" \
            -backend-config="secret_key=${TF_BACKEND_SECRET_KEY}"

      - name: terraform plan
        run: terraform plan -no-color -out=tfplan

      - name: Upload plan
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-aws
          path: infra/terraform/tfplan
          retention-days: 1 # the plan file contains variable values
          if-no-files-found: error

  apply:
    name: apply
    needs: plan
    if: >-
      github.actor != 'dependabot[bot]' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'apply'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: prod
    permissions:
      contents: read
      id-token: write # AWS OIDC
    env:
      TF_BACKEND_ACCESS_KEY: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
      TF_BACKEND_SECRET_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-TerraformAWS-Apply
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init (Supabase S3 backend)
        run: |
          terraform init \
            -backend-config="access_key=${TF_BACKEND_ACCESS_KEY}" \
            -backend-config="secret_key=${TF_BACKEND_SECRET_KEY}"

      - name: Download plan
        uses: actions/download-artifact@v8
        with:
          name: tfplan-aws
          path: infra/terraform

      - name: terraform apply (saved plan)
        run: terraform apply -auto-approve -no-color tfplan

  destroy:
    name: destroy
    if: github.actor != 'dependabot[bot]' && github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: prod
    permissions:
      contents: read
      id-token: write # AWS OIDC
    env:
      TF_BACKEND_ACCESS_KEY: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
      TF_BACKEND_SECRET_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_grafana_cloud_api_token: ${{ secrets.GRAFANA_CLOUD_API_TOKEN }}
      TF_VAR_otel_exporter_otlp_headers: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
      TF_VAR_supabase_service_role_key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TF_VAR_mlflow_tracking_uri: ${{ secrets.MLFLOW_TRACKING_URI }}
      TF_VAR_supabase_s3_access_key: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
      TF_VAR_supabase_s3_secret_key: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
      TF_VAR_supabase_url: ${{ secrets.SUPABASE_URL }}
      TF_VAR_otel_exporter_otlp_protocol: ${{ vars.OTEL_EXPORTER_OTLP_PROTOCOL }}
      TF_VAR_otel_exporter_otlp_endpoint: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
      TF_VAR_grafana_otlp_instance_id: ${{ vars.GRAFANA_OTLP_INSTANCE_ID }}
      TF_VAR_api_domain: ${{ vars.API_DOMAIN }}
      TF_VAR_cloudflare_zone_name: ${{ vars.CLOUDFLARE_ZONE_NAME }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
    steps:
      - name: Guard (master only + confirm phrase)
        working-directory: .
        env:
          CONFIRM_DESTROY: ${{ inputs.confirm_destroy }}
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/master" ]; then
            echo "::error::destroy may only run from refs/heads/master (got $REF)"
            exit 1
          fi
          if [ "$CONFIRM_DESTROY" != "destroy-pv-forecasting" ]; then
            echo "::error::confirm_destroy must be exactly 'destroy-pv-forecasting'"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Cloudflare API token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is empty on environment prod"
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-TerraformAWS-Destroy
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init (Supabase S3 backend)
        run: |
          terraform init \
            -backend-config="access_key=${TF_BACKEND_ACCESS_KEY}" \
            -backend-config="secret_key=${TF_BACKEND_SECRET_KEY}"

      - name: Build destroy targets (billable resources only)
        id: targets
        run: |
          # terraform 1.14 has no -exclude flag, so every billable resource in state is
          # targeted by full address. Keep rules live in one helper shared with the guard.
          cat > "$RUNNER_TEMP/destroy_filter.py" <<'PY'
          import json, re, sys

          # Never destroyed: IAM (incl. OIDC provider), ECR, security groups, VPC networking,
          # ACM, SSM parameters, the Cloudflare zone setting and ACM validation records.
          # aws_sqs_queue is kept too: module.pipeline_scheduler's aws_iam_role_policy.eventbridge_ecs
          # references the DLQ ARN, so destroying the queue would also delete that IAM policy
          # (an idle SQS queue has no cost).
          KEEP_TYPE_PREFIXES = (
              "aws_iam_", "aws_ecr_", "aws_security_group", "aws_vpc_security_group_",
              "aws_acm_", "aws_vpc", "aws_subnet", "aws_internet_gateway", "aws_route_table",
              "aws_default_",
          )
          KEEP_TYPES = {"aws_ssm_parameter", "cloudflare_zone_setting", "aws_sqs_queue"}
          KEEP_TYPE_NAMES = {("cloudflare_dns_record", "acm_validation")}

          MODULE_PREFIX = re.compile(r'^((?:module\.[A-Za-z0-9_-]+(?:\[[^\]]*\])?\.)*)')
          RESOURCE = re.compile(r'^(data\.)?([A-Za-z0-9_-]+)\.([A-Za-z0-9_-]+)(\[.*\])?$')

          def parse(addr):
              mods = MODULE_PREFIX.match(addr).group(1)
              m = RESOURCE.match(addr[len(mods):])
              if not m:
                  sys.exit(f"::error::cannot parse state address: {addr}")
              return mods, bool(m.group(1)), m.group(2), m.group(3)

          def kept(addr):
              mods, _, rtype, name = parse(addr)
              return (
                  mods.startswith("module.ecr.") or mods.startswith("module.ecr[")
                  or rtype.startswith(KEEP_TYPE_PREFIXES)
                  or rtype in KEEP_TYPES
                  or (rtype, name) in KEEP_TYPE_NAMES
              )

          def targets(state_list, targets_out, kept_out):
              tgt, keep = [], []
              for addr in (l.strip() for l in open(state_list)):
                  if not addr or parse(addr)[1]:
                      continue  # blank line or data source
                  (keep if kept(addr) else tgt).append(addr)
              open(targets_out, "w").write("".join(a + "\n" for a in tgt))
              open(kept_out, "w").write("".join(a + "\n" for a in keep))

          def guard(plan_json):
              plan = json.load(open(plan_json))
              deletes = [rc["address"] for rc in plan.get("resource_changes") or []
                         if "delete" in rc["change"]["actions"]]
              bad = [a for a in deletes if kept(a)]
              print("\n".join(deletes))
              if bad:
                  print("::error::destroy plan would delete kept resources:", file=sys.stderr)
                  print("\n".join(bad), file=sys.stderr)
                  sys.exit(1)

          if __name__ == "__main__":
              {"targets": targets, "guard": guard}[sys.argv[1]](*sys.argv[2:])
          PY

          terraform state list > state_addresses.txt
          python3 "$RUNNER_TEMP/destroy_filter.py" targets state_addresses.txt destroy_targets.txt kept.txt
          rm -f state_addresses.txt
          {
            echo "### Kept on destroy (IAM / ECR / SG / ACM / SSM / zone setting / DLQ)"
            echo ""
            sed 's/^/- `/; s/$/`/' kept.txt
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ ! -s destroy_targets.txt ]; then
            echo "Nothing billable left to destroy" >> "$GITHUB_STEP_SUMMARY"
            echo "Nothing billable left to destroy"
            echo "has_targets=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "### Destroy targets"
            echo ""
            sed 's/^/- `/; s/$/`/' destroy_targets.txt
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          echo "has_targets=true" >> "$GITHUB_OUTPUT"

      - name: terraform plan -destroy (billable resources only)
        if: steps.targets.outputs.has_targets == 'true'
        run: |
          args=()
          while IFS= read -r t; do
            [ -n "$t" ] && args+=("-target=$t")
          done < destroy_targets.txt
          if [ "${#args[@]}" -eq 0 ]; then
            echo "::error::no targets; refusing to run an untargeted plan -destroy"
            exit 1
          fi
          terraform plan -destroy -input=false -no-color "${args[@]}" -out=destroy.tfplan

      - name: Verify plan deletes no kept resource
        if: steps.targets.outputs.has_targets == 'true'
        run: |
          terraform show -json destroy.tfplan > "$RUNNER_TEMP/destroy_plan.json"
          python3 "$RUNNER_TEMP/destroy_filter.py" guard "$RUNNER_TEMP/destroy_plan.json" > planned_deletes.txt
          rm -f "$RUNNER_TEMP/destroy_plan.json"
          {
            echo "### Planned deletes"
            echo ""
            sed 's/^/- `/; s/$/`/' planned_deletes.txt
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Destroy plan summary
        if: steps.targets.outputs.has_targets == 'true'
        run: |
          summary="$(terraform show -no-color destroy.tfplan | grep -E '^(Plan:|No changes)' || true)"
          {
            echo "### Terraform AWS destroy plan (billable only)"
            echo ""
            echo "${summary:-no Plan line found}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: terraform apply (saved destroy plan)
        if: steps.targets.outputs.has_targets == 'true'
        run: terraform apply -input=false -no-color destroy.tfplan
