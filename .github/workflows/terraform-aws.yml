name: Terraform AWS

# Remote state: Supabase Storage S3-compatible backend (bucket terraform-state / aws/terraform.tfstate)
# Working directory: infra/terraform (do NOT run terraform from repo root)
# Chain: fmt -> validate -> plan (uploads tfplan) -> apply (master only, prod env, applies that exact plan)
# Manual destroy: workflow_dispatch with action=destroy and confirm_destroy=destroy-pv-forecasting
# (master only, prod env). Runs plan -destroy then applies that saved plan; plan/apply jobs are skipped.
# ECR is kept on purpose: destroy targets every top-level module/resource in state except module.ecr
# (repos + lifecycle policies), so images survive and a later apply re-adopts them (they stay in state).
# Destroy caveats: the CI role cannot detach/delete its own IAM role/policies (DenySelfEscalation),
# so those need an admin; the Supabase state bucket from backend.tf is never destroyed.

on:
  push:
    branches: [master]
    paths:
      - "infra/terraform/**"
      - "!infra/terraform/supabase/**"
      - ".github/workflows/terraform-aws.yml"
  pull_request:
    paths:
      - "infra/terraform/**"
      - "!infra/terraform/supabase/**"
      - ".github/workflows/terraform-aws.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "plan = plan only; apply = plan + apply (master only); destroy = plan -destroy + apply (master only)"
        type: choice
        options:
          - plan
          - apply
          - destroy
        default: plan
      confirm_destroy:
        description: "Required for action=destroy: type destroy-pv-forecasting"
        type: string
        required: false
        default: ""

permissions:
  contents: read

# One run at a time against the shared state; never cancel a running apply.
concurrency:
  group: terraform-aws
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  TF_VERSION: "1.14.3"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

defaults:
  run:
    working-directory: infra/terraform

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt -check
        run: terraform fmt -check -recursive -diff

  validate:
    name: validate
    needs: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init (no backend)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

  plan:
    name: plan
    needs: validate
    if: github.event_name != 'workflow_dispatch' || inputs.action != 'destroy'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # prod holds the env-scoped secrets/vars the plan needs (no protection rules today).
    environment: prod
    permissions:
      contents: read
      id-token: write # AWS OIDC
    env:
      TF_BACKEND_ACCESS_KEY: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
      TF_BACKEND_SECRET_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_grafana_cloud_api_token: ${{ secrets.GRAFANA_CLOUD_API_TOKEN }}
      TF_VAR_otel_exporter_otlp_headers: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
      TF_VAR_supabase_service_role_key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TF_VAR_mlflow_tracking_uri: ${{ secrets.MLFLOW_TRACKING_URI }}
      TF_VAR_supabase_s3_access_key: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
      TF_VAR_supabase_s3_secret_key: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
      TF_VAR_supabase_url: ${{ secrets.SUPABASE_URL }}
      TF_VAR_otel_exporter_otlp_protocol: ${{ vars.OTEL_EXPORTER_OTLP_PROTOCOL }}
      TF_VAR_otel_exporter_otlp_endpoint: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
      TF_VAR_grafana_otlp_instance_id: ${{ vars.GRAFANA_OTLP_INSTANCE_ID }}
      TF_VAR_api_domain: ${{ vars.API_DOMAIN }}
      TF_VAR_cloudflare_zone_name: ${{ vars.CLOUDFLARE_ZONE_NAME }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Cloudflare API token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is empty on environment prod"
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-TerraformAWS-Plan
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init (Supabase S3 backend)
        run: |
          terraform init \
            -backend-config="access_key=${TF_BACKEND_ACCESS_KEY}" \
            -backend-config="secret_key=${TF_BACKEND_SECRET_KEY}"

      - name: terraform plan
        run: terraform plan -no-color -out=tfplan

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-aws
          path: infra/terraform/tfplan
          retention-days: 1 # the plan file contains variable values
          if-no-files-found: error

  apply:
    name: apply
    needs: plan
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'apply'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: prod
    permissions:
      contents: read
      id-token: write # AWS OIDC
    env:
      TF_BACKEND_ACCESS_KEY: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
      TF_BACKEND_SECRET_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-TerraformAWS-Apply
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init (Supabase S3 backend)
        run: |
          terraform init \
            -backend-config="access_key=${TF_BACKEND_ACCESS_KEY}" \
            -backend-config="secret_key=${TF_BACKEND_SECRET_KEY}"

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-aws
          path: infra/terraform

      - name: terraform apply (saved plan)
        run: terraform apply -auto-approve -no-color tfplan

  destroy:
    name: destroy
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: prod
    permissions:
      contents: read
      id-token: write # AWS OIDC
    env:
      TF_BACKEND_ACCESS_KEY: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
      TF_BACKEND_SECRET_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_grafana_cloud_api_token: ${{ secrets.GRAFANA_CLOUD_API_TOKEN }}
      TF_VAR_otel_exporter_otlp_headers: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
      TF_VAR_supabase_service_role_key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TF_VAR_mlflow_tracking_uri: ${{ secrets.MLFLOW_TRACKING_URI }}
      TF_VAR_supabase_s3_access_key: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
      TF_VAR_supabase_s3_secret_key: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
      TF_VAR_supabase_url: ${{ secrets.SUPABASE_URL }}
      TF_VAR_otel_exporter_otlp_protocol: ${{ vars.OTEL_EXPORTER_OTLP_PROTOCOL }}
      TF_VAR_otel_exporter_otlp_endpoint: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
      TF_VAR_grafana_otlp_instance_id: ${{ vars.GRAFANA_OTLP_INSTANCE_ID }}
      TF_VAR_api_domain: ${{ vars.API_DOMAIN }}
      TF_VAR_cloudflare_zone_name: ${{ vars.CLOUDFLARE_ZONE_NAME }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
    steps:
      - name: Guard (master only + confirm phrase)
        working-directory: .
        env:
          CONFIRM_DESTROY: ${{ inputs.confirm_destroy }}
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/master" ]; then
            echo "::error::destroy may only run from refs/heads/master (got $REF)"
            exit 1
          fi
          if [ "$CONFIRM_DESTROY" != "destroy-pv-forecasting" ]; then
            echo "::error::confirm_destroy must be exactly 'destroy-pv-forecasting'"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Cloudflare API token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is empty on environment prod"
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-TerraformAWS-Destroy
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init (Supabase S3 backend)
        run: |
          terraform init \
            -backend-config="access_key=${TF_BACKEND_ACCESS_KEY}" \
            -backend-config="secret_key=${TF_BACKEND_SECRET_KEY}"

      - name: Build destroy targets (everything except ECR)
        id: targets
        run: |
          # terraform 1.14 has no -exclude flag, so target every top-level module/resource
          # in state except module.ecr. -target also pulls in dependents, never dependencies;
          # module.ecr depends on no managed resource, so it is not destroyed transitively.
          terraform state list > state_addresses.txt
          python3 - <<'PY'
          import re, sys
          addrs = [l.strip() for l in open("state_addresses.txt") if l.strip()]
          targets, excluded = [], []
          for a in addrs:
              if re.search(r"(^|\.)data\.", a):
                  continue
              m = re.match(r"^(module\.[A-Za-z0-9_-]+)", a)
              top = m.group(1) if m else re.sub(r"\[.*\]$", "", a)
              if top == "module.ecr" or top.startswith("aws_ecr_"):
                  excluded.append(a)
                  continue
              if top.startswith("module.") and ".aws_ecr_" in a:
                  sys.exit(f"::error::ECR resource {a} lives outside module.ecr; refusing to target {top}")
              if top not in targets:
                  targets.append(top)
          if not targets:
              sys.exit("::error::no non-ECR resources in state; nothing to destroy")
          with open("destroy_targets.txt", "w") as f:
              f.write("\n".join(targets) + "\n")
          with open("ecr_kept.txt", "w") as f:
              f.write("\n".join(excluded) + "\n")
          PY
          {
            echo "### Kept on destroy (ECR)"
            echo ""
            sed 's/^/- `/; s/$/`/' ecr_kept.txt
            echo ""
            echo "### Destroy targets"
            echo ""
            sed 's/^/- `/; s/$/`/' destroy_targets.txt
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f state_addresses.txt

      - name: terraform plan -destroy (excluding ECR)
        run: |
          args=()
          while IFS= read -r t; do
            [ -n "$t" ] && args+=("-target=$t")
          done < destroy_targets.txt
          terraform plan -destroy -input=false -no-color "${args[@]}" -out=destroy.tfplan

      - name: Verify plan keeps ECR
        run: |
          ecr_deletes="$(terraform show -json destroy.tfplan \
            | jq -r '.resource_changes[]? | select(((.type | startswith("aws_ecr_")) or (.address | startswith("module.ecr."))) and (.change.actions | index("delete"))) | .address')"
          if [ -n "$ecr_deletes" ]; then
            echo "::error::destroy plan would delete ECR resources:"
            echo "$ecr_deletes"
            exit 1
          fi

      - name: Destroy plan summary
        run: |
          summary="$(terraform show -no-color destroy.tfplan | grep -E '^(Plan:|No changes)' || true)"
          {
            echo ""
            echo "### Terraform AWS destroy plan (ECR kept)"
            echo ""
            echo "${summary:-no Plan line found}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: terraform apply (saved destroy plan)
        run: terraform apply -input=false -no-color destroy.tfplan
