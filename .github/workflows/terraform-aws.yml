name: Terraform AWS

# Remote state: Supabase Storage S3-compatible backend (bucket terraform-state / aws/terraform.tfstate)
# Working directory: infra/terraform  (do NOT run terraform from repo root)

on:
  push:
    branches: [main, master]
    paths:
      - "infra/terraform/**"
      - "!infra/terraform/supabase/**"
      - ".github/workflows/terraform-aws.yml"
  pull_request:
    paths:
      - "infra/terraform/**"
      - "!infra/terraform/supabase/**"
      - ".github/workflows/terraform-aws.yml"
  workflow_dispatch:
    inputs:
      apply:
        description: "Run terraform apply after plan"
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read
  actions: write

env:
  AWS_REGION: ap-south-1
  TF_IN_AUTOMATION: "true"

jobs:
  terraform:
    name: fmt → init → validate → plan → apply
    runs-on: ubuntu-latest
    environment: prod
    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-TerraformAWS
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.3"
          terraform_wrapper: false

      - name: Terraform fmt -check
        run: terraform fmt -check -recursive

      - name: Terraform init (Supabase S3 backend)
        run: |
          terraform init -input=false \
            -backend-config="access_key=${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}" \
            -backend-config="secret_key=${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        env:
          # Prefer TF_VAR_* so secrets are not mangled by shell -var="..." quoting
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_grafana_cloud_api_token: ${{ secrets.GRAFANA_CLOUD_API_TOKEN }}
          TF_VAR_otel_exporter_otlp_headers: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          TF_VAR_supabase_service_role_key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TF_VAR_mlflow_tracking_uri: ${{ secrets.MLFLOW_TRACKING_URI }}
          TF_VAR_supabase_s3_access_key: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          TF_VAR_supabase_s3_secret_key: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
          TF_VAR_supabase_url: ${{ secrets.SUPABASE_URL }}
          TF_VAR_otel_exporter_otlp_protocol: ${{ vars.OTEL_EXPORTER_OTLP_PROTOCOL }}
          TF_VAR_otel_exporter_otlp_endpoint: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
          TF_VAR_grafana_otlp_instance_id: ${{ vars.GRAFANA_OTLP_INSTANCE_ID }}
          TF_VAR_api_domain: ${{ vars.API_DOMAIN }}
          TF_VAR_cloudflare_zone_name: ${{ vars.CLOUDFLARE_ZONE_NAME }}
          TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Terraform apply
        if: >-
          github.event_name == 'workflow_dispatch' && inputs.apply ||
          (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
        run: terraform apply -input=false -auto-approve -no-color tfplan

      - name: Publish API URL + frontend origin to GitHub env vars
        if: >-
          github.event_name == 'workflow_dispatch' && inputs.apply ||
          (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          API_URL=$(terraform output -raw api_url)
          gh variable set VITE_BACKEND_API_URL --env prod --body "$API_URL" --repo "$GITHUB_REPOSITORY"
          gh variable set FRONTEND_ORIGIN --env prod --body "https://pv-forecasting.vercel.app" --repo "$GITHUB_REPOSITORY"
          echo "Set VITE_BACKEND_API_URL=$API_URL"
          echo "Set FRONTEND_ORIGIN=https://pv-forecasting.vercel.app"
