name: Terraform Supabase

# Remote state: Supabase Storage S3-compatible backend (bucket terraform-state / supabase/terraform.tfstate)
# Working directory: infra/terraform/supabase
# Chain: fmt -> validate -> plan (uploads tfplan) -> apply (master only, prod env, applies that exact plan)

on:
  push:
    branches: [master]
    paths:
      - "infra/terraform/supabase/**"
      - ".github/workflows/terraform-supabase.yml"
  pull_request:
    paths:
      - "infra/terraform/supabase/**"
      - ".github/workflows/terraform-supabase.yml"
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the plan (master only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: terraform-supabase
  cancel-in-progress: false

env:
  TF_VERSION: "1.14.3"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

defaults:
  run:
    working-directory: infra/terraform/supabase

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt -check
        run: terraform fmt -check -recursive -diff

  validate:
    name: validate
    needs: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init (no backend)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

  plan:
    name: plan
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # prod holds the env-scoped secrets the plan needs (no protection rules today).
    environment: prod
    env:
      TF_BACKEND_ACCESS_KEY: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
      TF_BACKEND_SECRET_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
      TF_VAR_supabase_access_token: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init (Supabase S3 backend)
        run: |
          terraform init \
            -backend-config="access_key=${TF_BACKEND_ACCESS_KEY}" \
            -backend-config="secret_key=${TF_BACKEND_SECRET_KEY}"

      - name: terraform plan
        run: terraform plan -no-color -out=tfplan

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-supabase
          path: infra/terraform/supabase/tfplan
          retention-days: 1 # the plan file contains variable values
          if-no-files-found: error

  apply:
    name: apply
    needs: plan
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.apply))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: prod
    env:
      TF_BACKEND_ACCESS_KEY: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
      TF_BACKEND_SECRET_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
      TF_VAR_supabase_access_token: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init (Supabase S3 backend)
        run: |
          terraform init \
            -backend-config="access_key=${TF_BACKEND_ACCESS_KEY}" \
            -backend-config="secret_key=${TF_BACKEND_SECRET_KEY}"

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-supabase
          path: infra/terraform/supabase

      - name: terraform apply (saved plan)
        run: terraform apply -auto-approve -no-color tfplan
