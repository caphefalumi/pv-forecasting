name: Terraform Supabase

# Remote state: Supabase Storage S3-compatible backend (bucket terraform-state / supabase/terraform.tfstate)
# Working directory: infra/terraform/supabase

on:
  push:
    branches: [main, master]
    paths:
      - "infra/terraform/supabase/**"
      - ".github/workflows/terraform-supabase.yml"
  pull_request:
    paths:
      - "infra/terraform/supabase/**"
      - ".github/workflows/terraform-supabase.yml"
  workflow_dispatch:
    inputs:
      apply:
        description: "Run terraform apply after plan"
        type: boolean
        default: true

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_supabase_access_token: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  terraform:
    name: fmt → init → validate → plan → apply
    runs-on: ubuntu-latest
    environment: prod
    defaults:
      run:
        working-directory: infra/terraform/supabase

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.3"
          terraform_wrapper: false

      - name: Terraform fmt -check
        run: terraform fmt -check -recursive

      - name: Terraform init (Supabase S3 backend)
        run: |
          terraform init -input=false \
            -backend-config="access_key=${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}" \
            -backend-config="secret_key=${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Terraform apply
        if: >-
          github.event_name == 'workflow_dispatch' && inputs.apply ||
          (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
        run: terraform apply -input=false -auto-approve -no-color tfplan
